[package]
name = "workshop-examples"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
panic-rtt-target = "0.2.0"
embedded-hal = "1.0.0"
rtt-target = "0.6.2"
lsm303agr = "1.1.0"

[dependencies.nrf52833-hal]
version = "0.19.0"
features = ["rt"]

[profile.release]
debug = true
lto = true
