[package]
name = "data-sink"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
csv = "1.4.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
tokio = { version = "1.54.1", features = ["net", "io-util", "macros", "rt-multi-thread", "sync", "time", "signal"] }

# For sensor-nodes
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
rand = "0.10.3"
